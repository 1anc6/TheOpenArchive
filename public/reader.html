<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf4ec">
  <title>Reader · Lanchenba Mutum</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23544c40'/><path d='M8 10c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1z' fill='none' stroke='%23f7f3ed' stroke-width='1.6'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=STIX+Two+Text:ital@0;1&family=Noto+Sans+Math&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=41">
  <link rel="stylesheet" href="css/reader.css?v=41">
  <!-- stats:start -->
  <script data-goatcounter="https://lance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

</head>
<body class="reader-body">
  <a class="skip-link" href="#pages">Skip to the essay</a>
  <header class="reader-bar">
    <a class="icon-btn" href="./" aria-label="Back to the collection">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </a>
    <div class="reader-titles">
      <h1 class="reader-title" id="title">Loading…</h1>
      <p class="tiny muted" id="author"></p>
    </div>
    <div class="reader-tools">
      <button class="icon-btn" id="pagesBtn" aria-label="Contents and pages" aria-expanded="false" title="Contents and pages">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
      </button>
      <button class="icon-btn desk-only" id="zoomOut" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <span class="tiny zoom-label desk-only" id="zoomLabel">100%</span>
      <button class="icon-btn desk-only" id="zoomIn" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" id="fullscreenBtn" aria-label="Full screen" aria-pressed="false" title="Full screen">
        <svg class="ic-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg>
        <svg class="ic-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v4a1 1 0 0 1-1 1H4M20 9h-4a1 1 0 0 1-1-1V4M15 20v-4a1 1 0 0 1 1-1h4M4 15h4a1 1 0 0 1 1 1v4"/></svg>
      </button>
      <button class="icon-btn more-btn" id="moreBtn" aria-label="More" aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu" title="More">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></svg>
      </button>
      <!-- In the bar on wider screens; a menu behind "More" on phones -->
      <div class="more-menu" id="moreMenu">
        <button class="icon-btn theme-btn" id="themeBtn" aria-label="Reading theme" title="Reading theme">
          <svg class="ic-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ic-sepia" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>
          <svg class="ic-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
          <span class="more-label">Reading theme</span>
        </button>
        <button class="icon-btn" id="listenBtn" aria-label="Listen to this essay" aria-pressed="false" title="Listen" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="6" rx="1.5"/><rect x="16.5" y="14" width="4.5" height="6" rx="1.5"/></svg>
          <span class="more-label">Listen</span>
        </button>
        <button class="music-btn music-btn-sm" data-music aria-pressed="false" aria-label="Background music">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="more-label">Music</span>
        </button>
        <a class="icon-btn" id="download" download aria-label="Request the PDF" title="Request the PDF">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
          <span class="more-label">Request the PDF</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Contents: the essay's sections -->
  <aside class="thumbs toc" id="toc" aria-label="Contents" hidden>
    <div class="thumbs-head">
      <div class="panel-tabs" role="tablist" aria-label="Browse the essay">
        <button type="button" role="tab" data-tab="toc" aria-selected="true">Contents</button>
        <button type="button" role="tab" data-tab="pages" aria-selected="false">Pages</button>
      </div>
      <button class="icon-btn" id="tocClose" aria-label="Close contents">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <ol class="toc-list" id="tocList"></ol>
  </aside>

  <!-- Page thumbnails: side panel on desktop, bottom sheet on phones -->
  <aside class="thumbs" id="thumbs" aria-label="Pages" hidden>
    <div class="thumbs-head">
      <div class="panel-tabs" role="tablist" aria-label="Browse the essay">
        <button type="button" role="tab" data-tab="toc" aria-selected="false">Contents</button>
        <button type="button" role="tab" data-tab="pages" aria-selected="true">Pages</button>
      </div>
      <button class="icon-btn" id="thumbsClose" aria-label="Close pages">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="thumbs-list" id="thumbsList"></div>
  </aside>

  <main class="pages" id="pages" tabindex="-1" aria-label="Essay pages" aria-busy="true"></main>

  <p class="swipe-hint listen-status" id="listenStatus" role="status" hidden></p>
  <p class="swipe-hint" id="swipeHint" hidden>Swipe left or right to turn pages</p>
  <p class="swipe-hint" id="tapHint" hidden>Tap the page to show or hide the controls</p>
  <p class="swipe-hint rotate-hint" id="rotateHint" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 9a9 9 0 0 1 4-5M21 15a9 9 0 0 1-4 5"/></svg>
    Turn your phone sideways to read these slides larger
  </p>

  <footer class="reader-foot">
    <button class="round-btn" id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
    <div class="reader-progress">
      <input type="range" id="scrub" min="1" value="1" aria-label="Page">
      <p class="tiny"><span id="pageNum">1</span> / <span id="pageTotal">–</span> <span class="muted" id="timeLeft"></span></p>
    </div>
    <button class="round-btn" id="next" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/common.js?v=41"></script>
  <script src="js/reader.js?v=41"></script>
  <script src="js/reviews.js?v=41"></script>
  <script src="js/request.js?v=41"></script>
  <script src="js/quote.js?v=41"></script>
  <script src="js/music.js?v=41"></script>
</body>
</html>
